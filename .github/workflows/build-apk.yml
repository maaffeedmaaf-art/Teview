name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vendor Arabic libraries
        run: |
          pip download "python-bidi==0.4.2" "arabic_reshaper==3.0.1" six \
            --no-deps -d /tmp/wh -q
          for w in /tmp/wh/*.whl; do unzip -q -o "$w" -d .; done
          rm -rf ./*.dist-info
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          ls -d bidi arabic_reshaper

      - name: Fetch Arabic font
        run: |
          mkdir -p assets
          if [ ! -f assets/NotoNaskhArabic-Regular.ttf ]; then
            curl -fsSL -o assets/NotoNaskhArabic-Regular.ttf \
              "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf"
          fi
          ls -l assets/

      - name: Early checks
        run: |
          python -c "import ast; ast.parse(open('main.py',encoding='utf-8').read()); print('main.py OK')"
          python -c "
          import sys; sys.path.insert(0,'.')
          import arabic_reshaper
          from bidi.algorithm import get_display
          print('Arabic OK:', get_display(arabic_reshaper.reshape('اختبار')))"
          grep -q 'python3==3.12' buildozer.spec \
            && echo 'Python pinned to 3.12 OK' \
            || { echo '::error::buildozer.spec must pin python3==3.12'; exit 1; }

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev build-essential ccache libltdl-dev

      - name: Cache SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: sdk-ndk-${{ runner.os }}-v1

      - name: Cache compiled recipes
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: recipes-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Extract errors
        if: failure()
        run: |
          grep -nE "error:|Error|Traceback|Command failed|fatal" build.log \
            | tail -60 > errors.txt || true
          echo "----- last 40 lines -----" >> errors.txt
          tail -40 build.log >> errors.txt
          cat errors.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: |
            errors.txt
            build.log
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgstories-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
