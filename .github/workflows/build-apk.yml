name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # p4a keeps TWO separate python recipes and both default to 3.14.2.
    # Pinning only python3 leaves hostpython3 at 3.14 -> host/target
    # mismatch. Recipe.version reads VERSION_<name>, so pin both here.
    env:
      VERSION_python3: '3.12.11'
      VERSION_hostpython3: '3.12.11'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Vendor Arabic libraries
        run: |
          pip download "python-bidi==0.4.2" "arabic_reshaper==3.0.1" six \
            --no-deps -d /tmp/wh -q
          for w in /tmp/wh/*.whl; do unzip -q -o "$w" -d .; done
          rm -rf ./*.dist-info
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          ls -d bidi arabic_reshaper

      - name: Fetch Arabic font
        run: |
          mkdir -p assets
          if [ ! -f assets/NotoNaskhArabic-Regular.ttf ]; then
            curl -fsSL -o assets/NotoNaskhArabic-Regular.ttf \
              "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf"
          fi
          ls -l assets/

      - name: Early checks
        run: |
          echo "=== FILES IN REPO ROOT ==="
          ls -la
          echo "=== main.py first line ==="
          head -1 main.py || echo "MISSING main.py"
          echo "=== buildozer.spec requirements line ==="
          grep -n "^requirements" buildozer.spec || echo "MISSING requirements line"
          echo "=== check 1 - main.py syntax ==="
          python -c "import ast,io; ast.parse(io.open('main.py',encoding='utf-8').read()); print('main.py parses OK')"
          echo "=== check 2 - vendored arabic libs ==="
          python -c "import sys; sys.path.insert(0,'.'); import arabic_reshaper; from bidi.algorithm import get_display; print('arabic libs OK')"
          echo "=== check 3 - python version pin ==="
          grep -q "python3==3.12" buildozer.spec && echo "pin OK" || { echo "::error::buildozer.spec is missing the python3==3.12 pin"; exit 1; }
          echo "=== ALL CHECKS PASSED ==="

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev build-essential ccache libltdl-dev

      - name: Cache SDK and NDK
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: sdk-ndk-${{ runner.os }}-v1

      - name: Cache compiled recipes
        uses: actions/cache@v6
        with:
          path: .buildozer
          key: recipes-${{ runner.os }}-py31211-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Extract errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            {
              echo "===== ERROR CONTEXT ====="
              grep -n -B8 -A25 -m2 -E "Traceback \(most recent call last\)|\[ERROR\]|Error compiling|Command failed" build.log | head -180
              echo
              echo "===== LAST 60 REAL LINES (env dump filtered) ====="
              grep -vE "^#? *[A-Z_0-9]+ = " build.log | tail -60
            } > errors.txt
          else
            echo "Build never started - see the Early checks step above." > errors.txt
          fi
          cat errors.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-errors
          path: errors.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tgstories-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
